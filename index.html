<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/dicle-logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOMS - Dicle Elektrik</title>
  <script>
    // Apply theme class immediately to prevent white flash on first render
    (function() {
      const theme = localStorage.getItem('themeMode');
      if (theme === 'dark') {
        document.documentElement.classList.add('dark-theme');
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
